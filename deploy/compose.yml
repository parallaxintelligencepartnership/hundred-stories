services:
  hundred-stories:
    image: nginx:1.29.4-alpine
    container_name: hundred-stories
    restart: unless-stopped
    volumes:
      - /opt/hundred-stories/html:/usr/share/nginx/html:ro
      - /opt/hundred-stories/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - dmz-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: dmz-infrastructure_dmz-public
      traefik.http.routers.hundred-stories.rule: Host(`${SITE_HOST}`)
      traefik.http.routers.hundred-stories.entrypoints: websecure
      traefik.http.routers.hundred-stories.tls.certresolver: letsencrypt
      traefik.http.routers.hundred-stories-http.rule: Host(`${SITE_HOST}`)
      traefik.http.routers.hundred-stories-http.entrypoints: web
      traefik.http.routers.hundred-stories-http.middlewares: https-redirect@file
      traefik.http.services.hundred-stories.loadbalancer.server.port: "80"

networks:
  dmz-public:
    external: true
    name: dmz-infrastructure_dmz-public
