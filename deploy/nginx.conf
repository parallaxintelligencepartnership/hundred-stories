worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  # nginx:1.29-alpine's bundled mime.types does not map .webmanifest. Chrome
  # will install a manifest served as application/octet-stream, but Safari
  # and Firefox are stricter, so name the type rather than hope.
  types {
    application/manifest+json webmanifest;
  }
  default_type application/octet-stream;

  log_format main '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # Vite fingerprints /assets. The service worker, its manifest, the three
  # page shells (landing /, guide /how-to-play/, game /play/), and the
  # update-registration script must always revalidate so a new release is
  # picked up promptly. This is a map rather than per-path location blocks
  # because an add_header inside a location replaces, rather than adds to,
  # the server-level security headers.
  map $uri $hundred_stories_cache_control {
    ~^/assets/                                              "public, max-age=31536000, immutable";
    ~^/(sw\.js|manifest\.webmanifest|index\.html|registerSW\.js)$  "no-cache, must-revalidate";
    ~^/(play|how-to-play)/(index\.html)?$                    "no-cache, must-revalidate";
    default                                                 "no-cache, must-revalidate";
  }

  server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $hundred_stories_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; worker-src 'self'; connect-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Permissions-Policy is set here as belt-and-suspenders even though pi3's
    # Traefik security-headers@file middleware on the websecure entrypoint
    # replaces (not appends) response headers and will overwrite this value
    # in production, same as documented for stillpub in
    # pubworks/docs/deploy-stillpub.md. Verify the live header after deploy.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HSTS. This container listens on plain HTTP; Traefik terminates TLS in
    # front of it, so this only means anything once it reaches the browser
    # over https://$SITE_HOST. No preload directive: preloading is a
    # one-way door.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The custom 404 page, the same one Workers serves through wrangler.jsonc not_found_handling.
    error_page 404 /404.html;

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
