[package]
name = "hundred-stories"
version = "0.4.9"
description = "Hundred Stories, the desktop shell (Steam)"
authors = ["Parallax Intelligence Partnership"]
license-file = "../LICENSE"
edition = "2021"
rust-version = "1.80.0"
publish = false

[lib]
# The _lib suffix keeps the library name apart from the binary's (a Cargo limitation on Windows).
name = "hundred_stories_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Steamworks achievements. Off by default so the shell builds without the Steamworks SDK;
# `npx tauri build --features steam` turns it on (see README.md).
steam = ["dep:steamworks"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-fs = "=2.5.2"
tauri-plugin-dialog = "=2.7.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
steamworks = { version = "=0.13.1", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
